name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest

    # The integration suite's database is a container in this runner. It is created when the
    # job starts and destroyed when the job ends, so every run gets a database nothing else
    # points at — the isolation the per-run managed-database branch used to provide, without an
    # external service, an API key, or a delete step that can leave anything behind.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_generation_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit

      # The database starts EMPTY. tests/setup.ts replays drizzle/ onto it and fails loud if a
      # migration does not apply, so this step is also the only place the journal is exercised
      # from nothing — a statement that only works against an already-populated database fails
      # here rather than on the boot migrator.
      - name: Run integration tests
        run: pnpm test:integration
        env:
          CONTENT_GENERATION_SERVICE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/content_generation_service_test
