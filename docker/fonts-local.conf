<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- LinkedIn/X embeds ask for system-ui / -apple-system: resolve those to Roboto, not
     DejaVu Sans (wider glyphs re-wrap the post and no longer look like a browser). -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
